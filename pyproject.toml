[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineering-handbook"
version = "0.1.0"
description = "A practical handbook for building production AI systems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AI Engineering Handbook contributors" }]
dependencies = []

[project.optional-dependencies]
docs = [
  "mkdocs-material>=9.5,<10",
]

[tool.setuptools]
packages = []

