site_name: AI Engineering Handbook
site_description: A practical guide to building reliable production AI systems
site_url: https://example.com/ai-engineering-handbook/
repo_name: ai-engineering-handbook

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Foundations:
      - Overview: foundations/index.md
      - LLM fundamentals: foundations/llm-fundamentals.md
      - Model selection: foundations/model-selection.md
  - Building:
      - Overview: building/index.md
      - Prompt engineering: building/prompt-engineering.md
      - Retrieval-augmented generation: building/rag.md
      - Agents and tool use: building/agents.md
  - Agents: agents/index.md
  - RAG: rag/index.md
  - MCP: mcp/index.md
  - Evaluation:
      - Overview: evaluation/index.md
  - Production:
      - Overview: production/index.md
      - Reliability: production/reliability.md
      - Security and privacy: production/security.md
  - Playbooks:
      - Production readiness review: playbooks/production-readiness.md
  - Learning journal:
      - Module 1 Q&A: learning-journal/module-01-qa.md
  - Interview preparation: interview/index.md
  - Glossary: glossary.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

plugins:
  - search

strict: true
